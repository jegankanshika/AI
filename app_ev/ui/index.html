<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EV Charging Co-Pilot · Tamil Nadu</title>
<style>
  :root {
    --bg:#0b0f14; --panel:#121821; --panel-2:#1a2230; --ink:#e6edf3;
    --muted:#8b9bb0; --accent:#22c55e; --accent-2:#38bdf8; --warn:#f59e0b; --bad:#ef4444;
    --border:#243044;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; background:linear-gradient(180deg,#0d141d, #0b0f14); }
  header h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:0.2px; }
  header .tag { font-size:11px; padding:3px 8px; border:1px solid var(--border); border-radius:999px; color:var(--muted); }
  nav { display:flex; gap:4px; padding:8px 16px; border-bottom:1px solid var(--border); overflow-x:auto; background:var(--panel); }
  nav button { background:transparent; color:var(--muted); border:1px solid transparent; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; white-space:nowrap; }
  nav button.active { background:var(--panel-2); color:var(--ink); border-color:var(--border); }
  nav button:hover { color:var(--ink); }
  main { padding:18px 22px; max-width:1300px; margin:0 auto; }
  .grid { display:grid; gap:14px; }
  .grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(380px,1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 8px 0; font-size:14px; font-weight:600; color:var(--ink); letter-spacing:0.2px; }
  .card .kv { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; color:var(--muted); border-bottom:1px dashed #1f2a3c; }
  .card .kv span:last-child { color:var(--ink); }
  .stat { font-size:24px; font-weight:600; color:var(--accent); }
  .stat-sub { font-size:12px; color:var(--muted); margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  tr:hover td { background:#16202d; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .pill.high { background:#3b0f12; border-color:#7f1d1d; color:#fca5a5; }
  .pill.medium { background:#3a2906; border-color:#92400e; color:#fcd34d; }
  .pill.low { background:#0f2c1a; border-color:#166534; color:#86efac; }
  .pill.hw { background:#0c2030; border-color:#1e3a5f; color:#93c5fd; }
  input, select, textarea, button.primary {
    background:var(--panel-2); color:var(--ink); border:1px solid var(--border);
    padding:8px 12px; border-radius:8px; font-size:13px; font-family:inherit;
  }
  button.primary { background:var(--accent); color:#04150b; font-weight:600; cursor:pointer; border:none; }
  button.primary:hover { background:#16a34a; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:12px; }
  .ask-out { white-space:pre-wrap; background:#0a1320; padding:12px; border-radius:8px; border:1px solid var(--border); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; color:#cfe6ff; max-height:420px; overflow:auto; }
  details { margin-top:10px; }
  details summary { cursor:pointer; color:var(--accent-2); font-size:13px; }
  .legend { font-size:11px; color:var(--muted); padding-top:6px; }
  .right { margin-left:auto; }
  .hidden { display:none; }
  a { color:var(--accent-2); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>⚡ EV Charging Co-Pilot</h1>
  <span class="tag">Tamil Nadu · Market intel + site planning</span>
  <span class="right tag" id="asof">loading…</span>
</header>
<nav>
  <button data-view="dashboard" class="active">Dashboard</button>
  <button data-view="registrations">Registered EVs</button>
  <button data-view="stations">Charging Stations</button>
  <button data-view="economics">Station P&amp;L</button>
  <button data-view="challenges">Challenges</button>
  <button data-view="future">Future Locations</button>
  <button data-view="partners">Partners &amp; Contacts</button>
  <button data-view="setup">Setup Plans</button>
  <button data-view="forecast">Growth Forecast</button>
  <button data-view="ask">Ask the Agent</button>
</nav>
<main id="root"></main>

<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("en-IN");
const inr = (n) => "₹" + fmt(n);

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

const views = {};

views.dashboard = async () => {
  const [reg, st, ch, future] = await Promise.all([
    api("/registrations/summary"),
    api("/economics"),
    api("/challenges"),
    api("/future?scope=chennai&top_n=3")
  ]);
  return `
    <div class="grid cols-3">
      <div class="card"><h3>Registered EVs in TN</h3>
        <div class="stat">${fmt(reg.total)}</div>
        <div class="stat-sub">across ${reg.districts_covered} districts · as of ${reg.as_of}</div>
        <div class="kv"><span>Two-wheelers</span><span>${fmt(reg.two_wheeler)}</span></div>
        <div class="kv"><span>Three-wheelers</span><span>${fmt(reg.three_wheeler)}</span></div>
        <div class="kv"><span>Four-wheelers</span><span>${fmt(reg.four_wheeler)}</span></div>
        <div class="kv"><span>Bus / Truck</span><span>${fmt(reg.bus_truck)}</span></div>
      </div>
      <div class="card"><h3>Public Charging Portfolio</h3>
        <div class="stat">${fmt(st.totals.total_stations)} stations</div>
        <div class="stat-sub">${fmt(st.totals.chennai_stations)} Chennai · ${fmt(st.totals.highway_stations)} highway · uptime ${st.totals.avg_uptime_pct}%</div>
        <div class="kv"><span>Sessions (30d)</span><span>${fmt(st.totals.total_sessions_30d)}</span></div>
        <div class="kv"><span>Revenue (30d)</span><span>${inr(st.totals.total_revenue_30d_inr)}</span></div>
        <div class="kv"><span>Expenses (30d)</span><span>${inr(st.totals.total_expenses_30d_inr)}</span></div>
        <div class="kv"><span>Gross margin</span><span>${inr(st.totals.total_revenue_30d_inr - st.totals.total_expenses_30d_inr)}</span></div>
      </div>
      <div class="card"><h3>Open Challenges</h3>
        <div class="stat">${fmt(ch.count)}</div>
        <div class="stat-sub">${ch.challenges.filter(c=>c.severity==='high').length} high · ${ch.challenges.filter(c=>c.severity==='medium').length} medium · ${ch.challenges.filter(c=>c.severity==='low').length} low</div>
        ${ch.challenges.slice(0,4).map(c => `<div class="kv"><span>${c.title}</span><span class="pill ${c.severity}">${c.severity}</span></div>`).join("")}
      </div>
    </div>
    <div class="grid cols-2" style="margin-top:14px">
      <div class="card"><h3>Top recommended Chennai sites</h3>
        <table><thead><tr><th>#</th><th>Location</th><th>Score</th><th>Payback</th></tr></thead>
        <tbody>${future.locations.map(l=>`<tr><td>${l.rank}</td><td>${l.name}</td><td>${l.score}</td><td>${l.payback_months} mo</td></tr>`).join("")}</tbody></table>
      </div>
      <div class="card"><h3>How to use</h3>
        <p class="muted">Browse tabs above for district-wise EV counts, station economics, partner contacts, and lowest-cost setup plans. Or type a natural-language question on the <b>Ask the Agent</b> tab.</p>
        <p class="muted">Live APIs: <code>/registrations</code>, <code>/stations</code>, <code>/economics</code>, <code>/challenges</code>, <code>/future?scope=chennai|highway</code>, <code>/partners</code>, <code>/setup?mode=solo|partner|all</code>, <code>/forecast</code>, <code>POST /ask</code>.</p>
      </div>
    </div>`;
};

views.registrations = async () => {
  const d = await api("/registrations?top_n=40");
  return `
    <div class="card">
      <h3>Registered EVs in Tamil Nadu — district wise</h3>
      <div class="muted">${d.source}</div>
      <table style="margin-top:10px"><thead>
        <tr><th>District</th><th>Total EVs</th><th>2W</th><th>3W</th><th>4W</th><th>Bus/Truck</th><th>RTO offices (registered locations)</th></tr>
      </thead><tbody>
      ${d.districts.map(r => `
        <tr>
          <td><b>${r.district}</b></td>
          <td>${fmt(r.registered_evs)}</td>
          <td>${fmt(r.two_wheeler)}</td>
          <td>${fmt(r.three_wheeler)}</td>
          <td>${fmt(r.four_wheeler)}</td>
          <td>${fmt(r.bus_truck)}</td>
          <td class="muted">${(r.rto_offices||[]).join(", ")}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;
};

views.stations = async () => {
  const [all, hw] = await Promise.all([api("/stations"), api("/stations?highway_only=true")]);
  const rows = (lst) => lst.stations.map(s => `
    <tr>
      <td><b>${s.name}</b><div class="muted">${s.id} · ${s.operator}</div></td>
      <td>${s.district} ${s.highway?'<span class="pill hw">highway</span>':''}</td>
      <td class="muted">${s.location}</td>
      <td>${s.connectors.map(c=>`${c.count}× ${c.type} ${c.kw}kW`).join("<br>")}</td>
      <td>${s.uptime_pct}%</td>
      <td><a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank">map</a></td>
    </tr>`).join("");
  return `
    <div class="card"><h3>All public charging stations (${all.count})</h3>
      <table><thead><tr><th>Station</th><th>District</th><th>Address</th><th>Connectors</th><th>Uptime</th><th>Map</th></tr></thead>
      <tbody>${rows(all)}</tbody></table>
    </div>
    <div class="card" style="margin-top:14px"><h3>Highway stations (${hw.count})</h3>
      <table><thead><tr><th>Station</th><th>District</th><th>Address</th><th>Connectors</th><th>Uptime</th><th>Map</th></tr></thead>
      <tbody>${rows(hw)}</tbody></table>
    </div>`;
};

views.economics = async () => {
  const d = await api("/economics");
  return `
    <div class="card"><h3>Per-station economics (last 30 days)</h3>
      <table><thead><tr>
        <th>Station</th><th>District</th><th>Sessions</th><th>Revenue</th><th>Expenses</th><th>Gross</th><th>Margin %</th><th>₹/session</th><th>Uptime</th>
      </tr></thead><tbody>
      ${d.portfolio.map(r=>`
        <tr>
          <td><b>${r.name}</b><div class="muted">${r.id}</div></td>
          <td>${r.district} ${r.highway?'<span class="pill hw">hw</span>':''}</td>
          <td>${fmt(r.sessions_30d)}</td>
          <td>${inr(r.revenue_30d_inr)}</td>
          <td>${inr(r.expenses_30d_inr)}</td>
          <td>${inr(r.gross_margin_inr)}</td>
          <td>${r.gross_margin_pct}%</td>
          <td>${inr(r.revenue_per_session_inr)}</td>
          <td>${r.uptime_pct}%</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;
};

views.challenges = async () => {
  const d = await api("/challenges");
  return `<div class="grid cols-2">${d.challenges.map(c=>`
    <div class="card">
      <h3>${c.title} <span class="pill ${c.severity}" style="margin-left:6px">${c.severity}</span></h3>
      <p class="muted">${c.description}</p>
      <div class="kv"><span>Impact</span><span>${c.impact}</span></div>
      <details open><summary>Solutions (${c.solutions.length})</summary>
        <ul>${c.solutions.map(s=>`<li>${s}</li>`).join("")}</ul>
      </details>
    </div>`).join("")}</div>`;
};

views.future = async () => {
  const [chennai, highway] = await Promise.all([
    api("/future?scope=chennai&top_n=10"),
    api("/future?scope=highway&top_n=10")
  ]);
  const tbl = (d) => `
    <table><thead><tr>
      <th>#</th><th>Location</th><th>Score</th><th>Config</th><th>CapEx</th><th>Payback</th><th>Why</th><th>Map</th>
    </tr></thead><tbody>${d.locations.map(l=>`
      <tr>
        <td>${l.rank}</td>
        <td><b>${l.name}</b></td>
        <td>${l.score}</td>
        <td>${l.recommended_config}</td>
        <td>${inr(l.estimated_capex_inr)}</td>
        <td>${l.payback_months} mo</td>
        <td class="muted">${l.rationale}</td>
        <td><a href="https://www.google.com/maps?q=${l.lat},${l.lng}" target="_blank">map</a></td>
      </tr>`).join("")}</tbody></table>`;
  return `
    <div class="card"><h3>Inside Chennai — top sites</h3><div class="muted">${chennai.model}</div>${tbl(chennai)}</div>
    <div class="card" style="margin-top:14px"><h3>Highway — top sites</h3>${tbl(highway)}</div>`;
};

views.partners = async () => {
  const d = await api("/partners");
  return d.categories.map(cat => `
    <div class="card" style="margin-bottom:14px">
      <h3>${cat.category}</h3>
      <div class="muted"><b>Playbook:</b> ${cat.playbook}</div>
      <table style="margin-top:8px"><thead><tr>
        <th>Org</th><th>Role</th><th>Address</th><th>Phone</th><th>Email</th><th>Notes</th>
      </tr></thead><tbody>
      ${cat.contacts.map(c=>`
        <tr>
          <td><b>${c.name}</b></td>
          <td>${c.role}</td>
          <td class="muted">${c.address}</td>
          <td>${c.phone}</td>
          <td><a href="mailto:${c.email}">${c.email}</a></td>
          <td class="muted">${c.notes}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`).join("");
};

views.setup = async () => {
  const d = await api("/setup");
  const solo = d.lowest_cost_individual;
  return `
    <div class="card"><h3>Lowest-cost individual plan — ${solo.name}</h3>
      <div class="muted">${solo.target}</div>
      <div class="grid cols-3" style="margin-top:10px">
        <div class="card"><h3>CapEx</h3>
          <div class="stat">${inr(solo.capex_total_inr)}</div>
          ${solo.capex_line_items.map(i=>`<div class="kv"><span>${i.item}</span><span>${inr(i.amount)}</span></div>`).join("")}
        </div>
        <div class="card"><h3>Monthly OpEx</h3>
          <div class="stat">${inr(solo.monthly_opex_inr.total)}</div>
          ${Object.entries(solo.monthly_opex_inr).filter(([k])=>k!=="total").map(([k,v])=>`<div class="kv"><span>${k.replaceAll("_"," ")}</span><span>${inr(v)}</span></div>`).join("")}
        </div>
        <div class="card"><h3>Revenue assumptions</h3>
          <div class="stat">${inr(solo.revenue_assumptions.monthly_revenue_inr)}<span class="muted" style="font-size:12px">/mo</span></div>
          <div class="kv"><span>Sessions/day</span><span>${solo.revenue_assumptions.sessions_per_day}</span></div>
          <div class="kv"><span>Avg kWh/session</span><span>${solo.revenue_assumptions.avg_kwh_per_session}</span></div>
          <div class="kv"><span>Tariff INR/kWh</span><span>${solo.revenue_assumptions.avg_tariff_inr_per_kwh}</span></div>
          <div class="kv"><span>Payback</span><span><b>${solo.payback_months} months</b></span></div>
        </div>
      </div>
      <details style="margin-top:12px" open><summary>Applicable subsidies</summary>
        <ul>${solo.applicable_subsidies.map(s=>`<li>${s}</li>`).join("")}</ul>
      </details>
    </div>
    <div class="card" style="margin-top:14px"><h3>Partner vendor models</h3>
      <table><thead><tr><th>Model</th><th>Owner CapEx</th><th>Revenue split</th><th>Payback</th><th>Pros</th><th>Cons</th></tr></thead>
      <tbody>${d.partner_vendor_models.map(p=>`
        <tr>
          <td><b>${p.model}</b><div class="muted">${p.description}</div></td>
          <td>${inr(p.owner_capex_inr)}</td>
          <td>${p.revenue_split || "—"}</td>
          <td>${p.payback_months} mo</td>
          <td><ul style="margin:0;padding-left:18px">${p.pros.map(x=>`<li>${x}</li>`).join("")}</ul></td>
          <td><ul style="margin:0;padding-left:18px">${p.cons.map(x=>`<li>${x}</li>`).join("")}</ul></td>
        </tr>`).join("")}</tbody></table>
    </div>
    <div class="card" style="margin-top:14px"><h3>Side-by-side comparison</h3>
      <table><thead><tr><th>Plan</th><th>CapEx</th><th>Payback</th><th>Margin profile</th><th>Best for</th></tr></thead>
      <tbody>${d.comparison_summary.map(r=>`
        <tr><td><b>${r.plan}</b></td><td>${inr(r.capex_inr)}</td><td>${r.payback_months} mo</td><td>${r.margin_profile}</td><td>${r.best_for}</td></tr>`).join("")}</tbody></table>
    </div>`;
};

views.forecast = async () => {
  const d = await api("/forecast");
  return `
    <div class="card"><h3>TN EV stock forecast</h3>
      <div class="muted">${d.method}</div>
      <table style="margin-top:10px"><thead><tr><th>Year</th><th>2W</th><th>3W</th><th>4W</th><th>Bus/Truck</th><th>Total</th></tr></thead>
      <tbody>${d.tn_ev_stock_forecast.map(r=>`<tr><td>${r.year}</td><td>${fmt(r.two_wheeler)}</td><td>${fmt(r.three_wheeler)}</td><td>${fmt(r.four_wheeler)}</td><td>${fmt(r.bus_truck)}</td><td><b>${fmt(r.total)}</b></td></tr>`).join("")}</tbody></table>
    </div>
    <div class="card" style="margin-top:14px"><h3>Public charging demand</h3>
      <table><thead><tr><th>Year</th><th>Public chargers needed</th><th>Highway DC</th><th>City DC</th><th>City AC</th></tr></thead>
      <tbody>${d.public_charging_demand_forecast.map(r=>`<tr><td>${r.year}</td><td>${fmt(r.public_chargers_needed)}</td><td>${fmt(r.highway_dc_needed)}</td><td>${fmt(r.city_dc_needed)}</td><td>${fmt(r.city_ac_needed)}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="card" style="margin-top:14px"><h3>Industry revenue + capex (₹ Cr)</h3>
      <table><thead><tr><th>Year</th><th>Revenue ₹Cr</th><th>CapEx ₹Cr</th><th>Active operators</th></tr></thead>
      <tbody>${d.industry_revenue_forecast_tn_inr_cr.map(r=>`<tr><td>${r.year}</td><td>${fmt(r.revenue_cr)}</td><td>${fmt(r.capex_cr)}</td><td>${fmt(r.addressable_operators)}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="grid cols-2" style="margin-top:14px">
      <div class="card"><h3>Key drivers</h3><ul>${d.key_drivers.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="card"><h3>Risks</h3><ul>${d.risks.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div>`;
};

views.ask = async () => {
  return `
    <div class="card"><h3>Ask the EV Co-Pilot</h3>
      <p class="muted">Examples: "How many EVs in Coimbatore?" · "Show highway stations" · "Lowest cost setup plan" · "Future locations in Chennai" · "Partners for fuel retail co-location" · "Growth forecast"</p>
      <div class="row">
        <input id="q" style="flex:1; min-width:280px" placeholder="Ask something…" value="Give me a full TN EV charging market summary" />
        <button class="primary" id="go">Ask</button>
      </div>
      <div id="out" style="margin-top:12px"></div>
    </div>`;
};

async function runAsk() {
  const q = $("#q").value.trim();
  const out = $("#out");
  out.innerHTML = `<div class="muted">Thinking…</div>`;
  try {
    const r = await fetch("/ask", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({question:q})});
    const j = await r.json();
    out.innerHTML = `
      <div class="card"><h3>Intent: ${j.intent}</h3>
        <p>${j.summary}</p>
        <details><summary>Tool calls (${j.tool_calls.length})</summary>
          <ul>${j.tool_calls.map(t=>`<li><code>${t.name}</code> ${JSON.stringify(t.args)}</li>`).join("")}</ul>
        </details>
        <details open><summary>Data payload</summary>
          <div class="ask-out">${JSON.stringify(j.data,null,2).replace(/</g,"&lt;")}</div>
        </details>
        ${j.citations.length?`<div class="legend">Sources: ${j.citations.join(" · ")}</div>`:""}
      </div>`;
  } catch (e) {
    out.innerHTML = `<div class="card" style="border-color:#7f1d1d">Error: ${e.message}</div>`;
  }
}

async function mount(view) {
  $$("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  const html = await views[view]();
  $("#root").innerHTML = html;
  if (view === "ask") {
    $("#go").addEventListener("click", runAsk);
    $("#q").addEventListener("keydown", e => { if (e.key === "Enter") runAsk(); });
  }
}

$$("nav button").forEach(b => b.addEventListener("click", () => mount(b.dataset.view).catch(showErr)));

function showErr(e) { $("#root").innerHTML = `<div class="card" style="border-color:#7f1d1d">${e.message}</div>`; }

(async () => {
  try {
    const reg = await api("/registrations/summary");
    $("#asof").textContent = "data as of " + reg.as_of;
  } catch {}
  mount("dashboard").catch(showErr);
})();
</script>
</body>
</html>
